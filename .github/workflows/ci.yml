name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Browser install for the runtime/DOM scanner suites: without Chromium
      # 80+ assertions skip and the differentiating engine has no CI signal.
      - run: npx playwright install chromium --with-deps
      - run: npm run test:coverage
      # Production executor bundle. Its own tripwire fails the build if probe
      # sources leak `__name()` (see scripts/build-worker.mjs); without this
      # step a break would only surface on the GitHub Actions drain.
      - run: npm run worker:build
      - run: npm run build

  # Static bundle report (.next/diagnostics/analyze) — Next 16 Turbopack
  # analyzer, run with --output so it never opens the interactive server in CI.
  bundle-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run analyze
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/diagnostics/analyze/
          retention-days: 14

  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: complyloop
          POSTGRES_PASSWORD: complyloop
          POSTGRES_DB: complyloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complyloop -d complyloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://complyloop:complyloop@localhost:5432/complyloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Schema↔migration drift gate: fails when schema.ts drifts from the
      # applied migrations (recreates its meta snapshot on the fly).
      - run: npx drizzle-kit check
      - run: npm run test:db

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: complyloop
          POSTGRES_PASSWORD: complyloop
          POSTGRES_DB: complyloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complyloop -d complyloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://complyloop:complyloop@localhost:5432/complyloop
      AUTH_SECRET: e2e-secret
      AUTH_GITHUB_ID: e2e
      AUTH_GITHUB_SECRET: e2e
      AUTH_URL: http://localhost:3000
      E2E_AUTH_ENABLED: "1"
      E2E_FIXTURE_ROOT: ${{ github.workspace }}/e2e/fixtures/sample-app
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
