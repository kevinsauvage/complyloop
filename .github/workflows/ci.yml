name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Least privilege: CI only reads the repo — never grant the default write token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install chromium --with-deps
      - run: npm run test:coverage
      - run: npm run worker:build
      - run: npm run build

  # Static bundle report (.next/diagnostics/analyze) — Next 16 Turbopack
  # analyzer, run with --output so it never opens the interactive server in CI.
  bundle-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run analyze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-analysis
          path: .next/diagnostics/analyze/
          retention-days: 14

  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: complyloop
          POSTGRES_PASSWORD: complyloop
          POSTGRES_DB: complyloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complyloop -d complyloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://complyloop:complyloop@localhost:5432/complyloop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx drizzle-kit check
      - run: npm run test:db

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: complyloop
          POSTGRES_PASSWORD: complyloop
          POSTGRES_DB: complyloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complyloop -d complyloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://complyloop:complyloop@localhost:5432/complyloop
      E2E_DATABASE_URL: postgres://complyloop:complyloop@localhost:5432/complyloop
      AUTH_SECRET: e2e-secret
      AUTH_GITHUB_ID: e2e
      AUTH_GITHUB_SECRET: e2e
      AUTH_URL: http://localhost:3000
      E2E_AUTH_ENABLED: "1"
      E2E_FIXTURE_ROOT: ${{ github.workspace }}/e2e/fixtures/sample-app
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
