# Assessment executor (replaces Vercel serverless scans).
#
# Triggered immediately by `repository_dispatch` (`assessment-drain`, fired
# from the app when a manual/webhook assessment enqueues), every 15 min as
# the orphan/expired-lease backstop, or manually. Claims and runs queued jobs
# with a Playwright Chromium install — the same browser family as local dev,
# so verdicts no longer diverge per stack like the `@sparticuz/chromium`
# serverless builds did.
#
# Required repository secrets: `DATABASE_URL` (pooled Postgres),
# `COMPLYLOOP_APP_ID` + `COMPLYLOOP_APP_PRIVATE_KEY` (repo checkout — same
# values as the Vercel `GITHUB_APP_ID` / `GITHUB_APP_PRIVATE_KEY` production
# env vars; the `GITHUB_` prefix is reserved in Actions, so the workflow maps
# them onto the names the drain script reads).
# `workflow_dispatch` doubles as an operator drain button.
name: assessment-worker

# Least privilege: the runner only reads code. DB/GitHub access uses
# repository secrets, never the auto-issued token.
permissions:
  contents: read

on:
  repository_dispatch:
    types: [assessment-drain]
  schedule:
    # Backstop only — the dispatch above starts scans immediately.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Max jobs per batch (the drain loops until idle)
        default: "10"
      concurrency:
        description: Max jobs to run concurrently in this process
        default: "2"
      max-minutes:
        description: Wall-clock budget for the whole drain
        default: "20"

concurrency:
  group: assessment-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # A full drain incl. browser work must never hang a runner into the 6h
    # default and burn the free-minutes budget.
    timeout-minutes: 60
    # Job-level so the failure step's `if` can read it: a step's own `env` is
    # not visible to that step's condition, so the Slack post never fired.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Check queue depth
        id: gate
        # Deliberately before checkout/npm ci: an idle scheduled tick must cost
        # seconds, not a full install + browser download (~96 installs a day
        # otherwise). `psql` ships on ubuntu-latest; the query mirrors
        # `queuedAssessmentJobCount()` (queued + running — running is included
        # so an expired lease gets recovered). Explicit drains
        # (repository_dispatch, workflow_dispatch) always run.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          depth=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM assessment_jobs WHERE status IN ('queued','running')")
          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          if [ "$depth" = "0" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.gate.outputs.empty != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.gate.outputs.empty != 'true'
        with:
          node-version: "22"
          # ~/.npm tarballs: makes a node_modules cache miss cheaper too.
          cache: npm
      # Cached install: a live run then starts at runner + browser, not at a
      # cold `npm ci` (minutes). Keyed on the lockfile + workspace manifests;
      # the browser cache below is separate (same idea, different artefact).
      - name: Cache node_modules
        id: modules
        if: steps.gate.outputs.empty != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json') }}
      - run: npm ci
        if: steps.gate.outputs.empty != 'true' && steps.modules.outputs.cache-hit != 'true'
      - name: Cache Playwright browsers
        if: steps.gate.outputs.empty != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          # Lockfile hash pins the exact Playwright version, so the cached
          # browser always matches the runner code — same build as local dev.
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
        if: steps.gate.outputs.empty != 'true'
      - name: Drain assessment queue
        if: steps.gate.outputs.empty != 'true'
        # The drain loops until the queue is idle or ASSESSMENT_WORKER_MAX_MS
        # (default 20 min) elapses; the step gets that budget + 5 min for
        # teardown, so an operator-raised `max-minutes` cannot be SIGKILLed
        # mid-scan (which would leave a phantom `running` job until lease
        # expiry). A hung browser/teardown still fails fast: lease recovery
        # requeues whatever was claimed.
        timeout-minutes: ${{ (inputs['max-minutes'] || '20') * 1 + 5 }}
        run: npm run worker:drain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_APP_ID: ${{ secrets.COMPLYLOOP_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.COMPLYLOOP_APP_PRIVATE_KEY }}
          ASSESSMENT_WORKER_LIMIT: ${{ inputs.limit || '10' }}
          ASSESSMENT_WORKER_CONCURRENCY: ${{ inputs.concurrency || '2' }}
          ASSESSMENT_WORKER_MAX_MS: ${{ (inputs['max-minutes'] || '20') * 60000 }}
      - name: Notify on failure
        # Optional: set repository secret SLACK_WEBHOOK_URL to post failures.
        # No-op when unset — stock Actions notifications still apply.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$GITHUB_WORKFLOW failed on $REF_NAME — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$SLACK_WEBHOOK_URL"
