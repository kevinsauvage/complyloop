# Assessment executor (replaces Vercel serverless scans).
#
# Triggered immediately by `repository_dispatch` (`assessment-drain`, fired
# from the app when a manual/webhook assessment enqueues), every 15 min as
# the orphan/expired-lease backstop, or manually. Claims and runs queued jobs
# with a Playwright Chromium install — the same browser family as local dev,
# so verdicts no longer diverge per stack like the `@sparticuz/chromium`
# serverless builds did.
#
# Required repository secrets: `DATABASE_URL` (pooled Postgres),
# `COMPLYLOOP_APP_ID` + `COMPLYLOOP_APP_PRIVATE_KEY` (repo checkout +
# Check Runs — same values as the Vercel `GITHUB_APP_ID` /
# `GITHUB_APP_PRIVATE_KEY` production env vars; the `GITHUB_` prefix is
# reserved in Actions, so the workflow maps them onto the names the
# drain script reads).
# `workflow_dispatch` doubles as an operator drain button.
name: assessment-worker

# Least privilege: the runner only reads code. DB/GitHub access uses
# repository secrets, never the auto-issued token.
permissions:
  contents: read

on:
  repository_dispatch:
    types: [assessment-drain]
  schedule:
    # Backstop only — the dispatch above starts scans immediately.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Max jobs to attempt in this batch
        default: "10"
      concurrency:
        description: Max jobs to run concurrently in this process
        default: "2"

concurrency:
  group: assessment-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # A full batch (10 scans incl. browser work) must never hang a runner
    # into the 6h default and burn the free-minutes budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check queue depth
        id: gate
        # Scheduled ticks are the backstop: skip the browser cache/install
        # and the drain entirely when nothing is queued or running. Explicit
        # drains (repository_dispatch, workflow_dispatch) always run.
        run: |
          depth=$(npx tsx --conditions=react-server scripts/queue-depth.ts | tail -n 1)
          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          if [ "$depth" = "0" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Cache Playwright browsers
        if: steps.gate.outputs.empty != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          # Lockfile hash pins the exact Playwright version, so the cached
          # browser always matches the runner code — same build as local dev.
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
        if: steps.gate.outputs.empty != 'true'
      - name: Drain assessment queue
        if: steps.gate.outputs.empty != 'true'
        # A healthy batch takes minutes; a hung browser/teardown must fail
        # fast instead of burning to the job timeout (lease recovery
        # requeues whatever was claimed).
        timeout-minutes: 25
        run: npm run worker:drain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_APP_ID: ${{ secrets.COMPLYLOOP_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.COMPLYLOOP_APP_PRIVATE_KEY }}
          ASSESSMENT_WORKER_LIMIT: ${{ inputs.limit || '10' }}
          ASSESSMENT_WORKER_CONCURRENCY: ${{ inputs.concurrency || '2' }}
      - name: Notify on failure
        # Optional: set repository secret SLACK_WEBHOOK_URL to post failures.
        # No-op when unset — stock Actions notifications still apply.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${{ github.workflow }} failed on ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
