# Ops check (replaces the old worker healthcheck).
#
# Runs `npm run ops:check` hourly: verifies DB reachability, assessment-queue
# depth, oldest-queued-job age, evidence-table growth, and that production
# dispatch env is present. Any breach — including a missing
# GH_WORKER_DISPATCH_TOKEN or a single job queued past the age threshold —
# exits non-zero so the workflow fails and stock Actions failure notifications
# fire. A red run here means "dispatch/schedule stopped draining" or "evidence
# is outgrowing the database".
#
# Required repository secrets: `DATABASE_URL` (pooled Postgres), and the
# production env the check validates (`AUTH_SECRET`, `AUTH_URL`, `GITHUB_APP_ID`,
# `GITHUB_APP_PRIVATE_KEY`, `GITHUB_WEBHOOK_SECRET`, `GH_WORKER_DISPATCH_TOKEN`).
# Optional vars: `OPS_MAX_QUEUED_JOBS` (default 50), `OPS_MAX_QUEUED_AGE_MINUTES`
# (default 20), `OPS_MAX_EVIDENCE_MB` (default 1024).
# Optional secrets: `SLACK_WEBHOOK_URL` (failure posts), `HEALTH_URL`
# (unauthenticated GET of the app `/api/health` endpoint).
name: ops-check

on:
  schedule:
    # Hourly: a stalled drain must page within the hour, not the day. The
    # 15-min worker tick is the backstop, so an hour-old queued job means the
    # backstop is down too (e.g. GitHub disabled the idle scheduled workflow).
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run ops check
        run: npm run ops:check
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required prod env — a missing dispatch token is the failure this
          # check exists to catch, so it must be visible here, not skipped.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          GH_WORKER_DISPATCH_TOKEN: ${{ secrets.GH_WORKER_DISPATCH_TOKEN }}
      - name: Ping app health
        # Optional: set repository secret HEALTH_URL to the /api/health URL.
        # The endpoint is an unauthenticated scrape target; non-200 fails.
        if: env.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$HEALTH_URL") || code="000"
          echo "health HTTP $code"
          [ "$code" = "200" ]
      - name: Notify on failure
        # Optional: set repository secret SLACK_WEBHOOK_URL to post failures.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${{ github.workflow }} failed on ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
