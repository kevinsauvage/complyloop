# Automated dependency updates. Grouped so routine bumps arrive as one PR
# per ecosystem instead of a flood; security updates are always individual.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # ESLint 10 breaks the plugins eslint-config-next pulls in; lift when they accept it.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Does not install until the Babel 8 peer chain settles (see TODO.md).
      - dependency-name: "@vitejs/plugin-react"
      # Types follow the Node runtime (24); bump them together with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
