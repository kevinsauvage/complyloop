services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5433 avoids clashing with a local Homebrew/Postgres.app on 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: complyloop
      POSTGRES_PASSWORD: complyloop
      POSTGRES_DB: complyloop
    volumes:
      - complyloop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyloop -d complyloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build: .
    # One-shot: applies migrations and exits. App replicas start only after it
    # succeeds (service_completed_successfully), so simultaneous replica
    # starts never race on migrations.
    command: ["npx", "tsx", "scripts/db-migrate.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://complyloop:***@postgres:5432/complyloop
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://complyloop:complyloop@postgres:5432/complyloop
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a unique value, e.g. openssl rand -base64 32}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      WORKER_SECRET: ${WORKER_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    profiles: ["app"]
    build: .
    command: ["npx", "tsx", "scripts/run-assessment-worker.ts"]
    environment:
      DATABASE_URL: postgres://complyloop:complyloop@postgres:5432/complyloop
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a unique value, e.g. openssl rand -base64 32}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
    depends_on:
      app:
        condition: service_healthy

volumes:
  complyloop_pg:
