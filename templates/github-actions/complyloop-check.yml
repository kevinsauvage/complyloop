# Copy into your assessed app as .github/workflows/complyloop-check.yml
#
# Prerequisites: add @complyloop/check as a dependency, e.g.
#   npm install ../path-to-complyloop/packages/check
# (or, once published: npm install @complyloop/check)
name: ComplyLoop check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  complyloop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx complyloop-check .
