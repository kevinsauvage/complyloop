# Copy into your assessed app as .github/workflows/complyloop-check.yml
#
# Prerequisites: npm install @complyloop/check
# (or from a local ComplyLoop checkout: npm run build:check &&
#  npm install /path/to/Compliance-Engineering-Platform/packages/check)
name: ComplyLoop check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  complyloop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx complyloop-check .
