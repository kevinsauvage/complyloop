# Copy into your assessed app as .github/workflows/complyloop-check.yml
#
# @complyloop/check is not on npm yet. From a ComplyLoop checkout:
#   npm run build:check
#   npm install /path/to/Compliance-Engineering-Platform/packages/check
name: ComplyLoop check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  complyloop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx complyloop-check .
